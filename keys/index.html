<title>선생님용 열쇠고리</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --ground: #faf8f5; --surface: #fff; --ink: #191c24; --muted: #6d7180;
    --rule: #e4ded4; --brass: #8d6222; --brass-soft: #f3ead9; --danger: #a33a2a;
    --display: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Apple SD Gothic Neo', serif;
    --body: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', 'Segoe UI', sans-serif;
    --mono: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#14161c; --surface:#1b1e26; --ink:#e9e5dd; --muted:#9198a8;
            --rule:#2c303b; --brass:#d3a24c; --brass-soft:#2e2718; --danger:#e08877; }
  }
  :root[data-theme="dark"] { --ground:#14161c; --surface:#1b1e26; --ink:#e9e5dd; --muted:#9198a8;
            --rule:#2c303b; --brass:#d3a24c; --brass-soft:#2e2718; --danger:#e08877; }
  :root[data-theme="light"] { --ground:#faf8f5; --surface:#fff; --ink:#191c24; --muted:#6d7180;
            --rule:#e4ded4; --brass:#8d6222; --brass-soft:#f3ead9; --danger:#a33a2a; }
  body { background: var(--ground); color: var(--ink); font-family: var(--body); line-height: 1.6; }
  #gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .lock {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 4px;
    padding: 34px 30px; width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 1px 2px rgba(25,28,36,.05), 0 10px 30px -20px rgba(25,28,36,.5);
  }
  .lock .eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
                   color: var(--brass); font-weight: 600; }
  .lock h1 { font-family: var(--display); font-size: 27px; font-weight: 600; line-height: 1.2; }
  .lock p { color: var(--muted); font-size: 14.5px; }
  .lock input {
    font-family: var(--mono); font-size: 16px; padding: 11px 13px;
    border: 1px solid var(--rule); border-radius: 3px;
    background: var(--ground); color: var(--ink); width: 100%;
  }
  .lock input:focus { outline: 2px solid var(--brass); outline-offset: 1px; border-color: transparent; }
  .lock button {
    font-family: var(--body); font-size: 15.5px; font-weight: 600; padding: 11px;
    border: 0; border-radius: 3px; background: var(--brass); color: var(--ground); cursor: pointer;
  }
  .lock button:disabled { opacity: .55; cursor: default; }
  .err { color: var(--danger); font-size: 14.5px; min-height: 1.6em; }
</style>

<div id="gate">
  <form class="lock" id="f">
    <span class="eyebrow">선생님용</span>
    <h1>플래시카드 열쇠고리</h1>
    <p>다섯 개 부트캠프의 링크와 챕터 비밀번호가 들어 있습니다. 마스터 암호를 입력하세요.</p>
    <input type="password" id="pw" placeholder="마스터 암호" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="go">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      err = document.getElementById('err'), go = document.getElementById('go');

  function bytes(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    go.textContent = '여는 중...';
    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pw.value.trim()), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(BLOB));
      })
      .then(function (buf) {
        document.body.innerHTML = new TextDecoder().decode(buf);
        wireCopy();
      })
      .catch(function () {
        err.textContent = '암호가 맞지 않습니다.';
        go.disabled = false;
        go.textContent = '열기';
        pw.select();
      });
  });

  function wireCopy() {
    document.querySelectorAll('.key').forEach(function (btn) {
      var original = btn.textContent;
      btn.setAttribute('title', '눌러서 복사');
      btn.addEventListener('click', function () {
        var done = function () {
          btn.textContent = '복사됨';
          btn.classList.add('copied');
          setTimeout(function () { btn.textContent = original; btn.classList.remove('copied'); }, 1100);
        };
        var fallback = function () {
          var ta = document.createElement('textarea');
          ta.value = original; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch (e) {}
          document.body.removeChild(ta);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(original).then(done, fallback);
        } else { fallback(); }
      });
    });
  }
