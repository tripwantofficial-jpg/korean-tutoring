<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자모 플래시카드 · Week 1</title>
<style>
  :root {
    --bg: #F6F1E7;
    --card-bg: #FFFCF6;
    --ink: #1F1B16;
    --muted: #8B7F6D;
    --rule: #E2D9C7;
    --accent: #2E4372;
    --correct: #3F6B3A;
    --wrong: #A83E2A;
    --btn-shadow: 0 1px 0 rgba(31,27,22,0.08);
    --card-shadow: 0 30px 60px -35px rgba(31,27,22,0.35), 0 4px 12px -4px rgba(31,27,22,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17130E;
      --card-bg: #211C16;
      --ink: #F1EADB;
      --muted: #8D8474;
      --rule: #2E2823;
      --accent: #8FA5D6;
      --correct: #7BAF71;
      --wrong: #D97960;
      --btn-shadow: 0 1px 0 rgba(0,0,0,0.4);
      --card-shadow: 0 40px 80px -40px rgba(0,0,0,0.7), 0 4px 12px -4px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="light"] {
    --bg: #F6F1E7; --card-bg: #FFFCF6; --ink: #1F1B16; --muted: #8B7F6D;
    --rule: #E2D9C7; --accent: #2E4372; --correct: #3F6B3A; --wrong: #A83E2A;
    --btn-shadow: 0 1px 0 rgba(31,27,22,0.08);
    --card-shadow: 0 30px 60px -35px rgba(31,27,22,0.35), 0 4px 12px -4px rgba(31,27,22,0.08);
  }
  :root[data-theme="dark"] {
    --bg: #17130E; --card-bg: #211C16; --ink: #F1EADB; --muted: #8D8474;
    --rule: #2E2823; --accent: #8FA5D6; --correct: #7BAF71; --wrong: #D97960;
    --btn-shadow: 0 1px 0 rgba(0,0,0,0.4);
    --card-shadow: 0 40px 80px -40px rgba(0,0,0,0.7), 0 4px 12px -4px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow: hidden;
  }
  .korean {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Nanum Gothic", system-ui, sans-serif;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    flex-shrink: 0;
  }
  .brand {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 2px;
    background: transparent;
    border: none;
    padding: 4px 8px;
    margin: -4px -8px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    transition: background 0.15s, color 0.15s;
  }
  .brand:hover { background: var(--card-bg); }
  .brand:hover .brand-title { color: var(--accent); }
  .brand-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.005em;
    color: var(--ink);
    line-height: 1.2;
    transition: color 0.15s;
  }
  .brand-subtitle {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.2;
  }
  .header-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .segmented {
    display: inline-flex;
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .segmented button {
    padding: 6px 14px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-family: inherit;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  .segmented button:hover { color: var(--ink); }
  .segmented button.active {
    background: var(--ink);
    color: var(--bg);
  }

  .stats {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 13px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.15;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat-value {
    font-size: 16px;
  }
  .stat-value.mono { font-size: 15px; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .deck-filter {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .deck-filter label {
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 10px;
  }
  .deck-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .chip {
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
  .chip.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .chip:disabled { opacity: 0.35; cursor: not-allowed; }
  .chip.set-chip {
    font-weight: 500;
  }
  .chip.set-chip.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }

  .toolbar-right {
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    border-radius: 6px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--muted); }

  /* ---------- Main ---------- */
  main {
    flex: 1;
    display: flex;
    align-items: safe center;
    justify-content: safe center;
    padding: 24px;
    overflow: auto;
    position: relative;
  }

  /* ---------- Card ---------- */
  .card-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    max-width: 100%;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 20px;
    width: min(560px, 88vw);
    aspect-ratio: 3 / 4;
    max-height: calc(100vh - 260px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: var(--card-shadow);
    padding: 32px;
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card:active { transform: translateY(0); }
  .card.flipping {
    animation: flip 0.35s ease;
  }
  @keyframes flip {
    0% { transform: rotateY(0); }
    50% { transform: rotateY(90deg); }
    100% { transform: rotateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .card:hover { transition: none; transform: none; }
    .card.flipping { animation: none; }
  }

  .card-index {
    position: absolute;
    top: 20px;
    left: 24px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .card-hint {
    position: absolute;
    bottom: 20px;
    right: 24px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .card-face {
    font-size: clamp(120px, 26vw, 260px);
    line-height: 1;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .card-face.answer {
    font-size: clamp(72px, 14vw, 140px);
  }

  .card-reveal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    min-height: 60px;
  }
  .card-reveal.hidden { visibility: hidden; }
  .card-sound {
    font-size: 24px;
    color: var(--accent);
    letter-spacing: 0.02em;
    font-weight: 500;
  }
  .card-name {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- Action buttons ---------- */
  .actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn {
    padding: 12px 22px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--bg);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    min-width: 108px;
    box-shadow: var(--btn-shadow);
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--rule);
  }
  .btn.ghost:hover { border-color: var(--muted); }
  .btn.wrong {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #FFF8F3;
  }
  .btn.correct {
    background: var(--correct);
    border-color: var(--correct);
    color: #F5FAF3;
  }
  .btn .kbd {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 6px;
    font-size: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    opacity: 0.7;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    vertical-align: 1px;
  }
  .btn.ghost .kbd {
    border-color: var(--rule);
    color: var(--muted);
  }

  /* ---------- Start / End screens ---------- */
  .screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 520px;
    padding: 40px 24px;
  }
  .screen h1 {
    font-size: 34px;
    font-weight: 500;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .screen p {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 15px;
    max-width: 42ch;
    text-wrap: balance;
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 28px;
    width: 100%;
    max-width: 400px;
  }
  .result-cell {
    background: var(--card-bg);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .result-cell .label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .result-cell .value {
    font-size: 32px;
    font-weight: 500;
    line-height: 1;
  }

  /* ---------- Review grid (end of round) ---------- */
  .review-block {
    margin-top: 8px;
    padding: 20px 20px 24px;
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 14px;
    width: 100%;
    max-width: 640px;
    text-align: left;
  }
  .review-block h3 {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px;
    font-weight: 500;
  }
  .review-block .review-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .review-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .review-tile {
    background: var(--bg);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--wrong);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 76px;
  }
  .review-tile .rt-char {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 26px;
    line-height: 1.15;
    color: var(--ink);
  }
  .review-tile .rt-sound {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }
  .review-tile .rt-meaning {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.35;
  }

  /* ---------- Round chip badge on end screen ---------- */
  .round-badge {
    display: inline-block;
    padding: 4px 12px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-radius: 999px;
    margin-bottom: 12px;
    font-weight: 500;
  }

  /* ---------- Round history (celebration) ---------- */
  .round-history {
    margin-top: 16px;
    padding: 18px 20px;
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 12px;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .round-history h3 {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 500;
    text-align: left;
  }
  .round-row {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  .round-row:last-child { border-bottom: none; }
  .round-row .r-num {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .round-row .r-detail {
    font-variant-numeric: tabular-nums;
  }
  .round-row .r-wrong {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .round-row .r-wrong strong {
    color: var(--ink);
    font-weight: 500;
  }
  .round-row.cleared .r-wrong strong { color: var(--correct); }

  .screen-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ---------- Footer ---------- */
  footer {
    padding: 10px 24px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    flex-shrink: 0;
  }
  .shortcuts {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .shortcut {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .shortcut kbd {
    display: inline-block;
    padding: 2px 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--ink);
    letter-spacing: 0;
  }

  /* ---------- Focus states ---------- */
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Session modal (card viewing) ---------- */
  .session-modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .session-header {
    flex: 0 0 auto;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--rule);
  }
  .session-back {
    background: transparent;
    border: 1px solid var(--rule);
    cursor: pointer;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color 0.15s, border-color 0.15s;
  }
  .session-back:hover { color: var(--ink); border-color: var(--muted); }
  .session-stats-mini {
    display: flex;
    gap: 20px;
  }
  .session-stats-mini .s-item {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.15;
    gap: 2px;
  }
  .session-stats-mini .s-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .session-stats-mini .s-value {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    color: var(--ink);
  }
  .session-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    min-height: 0;
    overflow: hidden;
  }
  /* Wrapper that provides the available space for the square card */
  .session-card-slot {
    flex: 1;
    width: 100%;
    max-width: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .session-card {
    aspect-ratio: 1;
    /* vh fallback first, then dvh progressive override */
    width: min(100%, calc(100vh - 220px), 520px);
    width: min(100%, calc(100dvh - 220px), 520px);
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-shadow: var(--card-shadow);
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: transform 0.15s ease;
  }
  .session-card:hover { transform: translateY(-2px); }
  .session-card.flipping { animation: flip 0.35s ease; }
  .session-card .card-face {
    font-size: min(28vw, 34vh, 220px);
    line-height: 1;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.02em;
    text-align: center;
  }
  .session-card .card-face.answer {
    font-size: min(14vw, 16vh, 100px);
  }
  .session-card .card-index {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .session-card .card-hint {
    position: absolute;
    bottom: 16px;
    right: 20px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .session-card .card-reveal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
  }
  .session-card .card-reveal.hidden { display: none; }
  .session-actions {
    flex: 0 0 auto;
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 520px;
    justify-content: center;
  }
  .session-actions .btn {
    flex: 1;
    max-width: 180px;
  }
  @media (max-width: 720px) {
    .session-header { padding: 10px 14px; }
    .session-stats-mini { gap: 12px; }
    .session-stats-mini .s-value { font-size: 13px; }
    .session-body { padding: 16px; gap: 16px; }
    .session-card { border-radius: 20px; padding: 18px; }
    .session-card .card-face { font-size: min(52vw, 40vh, 220px); }
    .session-card .card-face.answer { font-size: min(22vw, 18vh, 110px); }
    .session-actions .btn {
      padding: 12px 8px;
      font-size: 13px;
      min-width: 0;
    }
    .session-actions .btn .kbd { display: none; }
    .session-back { font-size: 12px; padding: 6px 10px; }
  }

  /* ---------- Landing page ---------- */
  .landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    max-width: 1080px;
    padding: 32px 24px;
    text-align: center;
    width: 100%;
  }

  /* Landing intro row: Jin photo with speech bubble + controls box side-by-side */
  .jin-controls-row {
    display: flex;
    align-items: center;
    gap: 32px;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }
  .jin-photo-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    flex: 0 0 auto;
  }
  .jin-photo {
    width: 220px;

  const LANG_KEY = 'jamo-flashcards-lang-v1';
  function loadLang() {
    try {
      const v = localStorage.getItem(LANG_KEY);
      return (v === 'ko' || v === 'en') ? v : 'ko';
    } catch { return 'ko'; }
  }
  function saveLang(lang) {
    try { localStorage.setItem(LANG_KEY, lang); } catch {}
  }
  function t(key, ...args) {
    const val = LOCALES[state.lang]?.[key] ?? LOCALES.ko[key];
    return typeof val === 'function' ? val(...args) : val;
  }
  function applyStaticI18n() {
    document.title = t('brand_title');
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-attr]').forEach(el => {
      // format: "attrName:key,attrName:key"
      el.dataset.i18nAttr.split(',').forEach(pair => {
        const [attr, key] = pair.split(':').map(s => s.trim());
        el.setAttribute(attr, t(key));
      });
    });
    // Language toggle button label shows the OTHER language
    const langBtn = document.getElementById('lang-toggle');
    if (langBtn) langBtn.textContent = t('btn_lang');
    // Update html lang attribute
    document.documentElement.setAttribute('lang', state.lang);
  }

  // ================================================================
  // State
  // ================================================================
  const STORAGE_KEY = 'jamo-flashcards-v1';

  const state = {
    lang: loadLang(),             // 'ko' | 'en'
    set: 'jamo',                  // 'jamo' | 'word'
    mode: 'diagnostic',           // 'diagnostic' | 'study' | 'reverse'
    deck: 'all',
    queue: [],                    // shuffled deck of card ids (this session/round)
    originalQueue: [],            // full deck when session started (for round 1 reference)
    index: -1,                    // -1 = start screen, queue.length = end screen
    revealed: false,
    startedAt: null,
    endedAt: null,
    round: 1,                     // review-drill round counter
    roundHistory: [],             // [{round, size, wrong, timeMs}, ...] for celebration
    wrongThisRound: [],           // list of card ids marked wrong (this round)
    savedWrong: loadWrong(),      // {jamo:[...], word:[...]} from localStorage
  };

  function loadWrong() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {jamo:[], word:[]};
      const parsed = JSON.parse(raw);
      // Backward compat: old flat array → treat as jamo
      if (Array.isArray(parsed)) return {jamo: parsed, word: []};
      return {jamo: parsed.jamo || [], word: parsed.word || []};
    } catch { return {jamo:[], word:[]}; }
  }
  function saveWrong(obj) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch {}
  }
  function currentSavedWrong() {
    return state.savedWrong[state.set] || [];
  }

  // ================================================================
  // Deck filtering
  // ================================================================
  function cardsFor(set, deck) {
    const pool = CARDS_BY_SET[set] || [];
    if (deck === 'all') return pool.map(c => c.id);
    if (deck === 'saved') return currentSavedWrong().filter(id => pool.find(c => c.id === id));
    return pool.filter(c => c.groups.includes(deck)).map(c => c.id);
  }
  function shuffle(arr) {
    const out = [...arr];
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }
  function cardInfo(id) {
    return JAMO.find(c => c.id === id) || WORDS.find(c => c.id === id);
  }
  // legacy alias for any leftover call sites
  const jamoInfo = cardInfo;

  // ================================================================
  // Session control
  // ================================================================
  function newSession() {
    state.queue = shuffle(cardsFor(state.set, state.deck));
    state.originalQueue = [...state.queue];
    state.index = -1;
    state.revealed = false;
    state.startedAt = null;
    state.endedAt = null;
    state.round = 1;
    state.roundHistory = [];
    state.wrongThisRound = [];
    render();
  }
  function startSession() {
    if (state.queue.length === 0) state.queue = shuffle(cardsFor(state.set, state.deck));
    if (state.originalQueue.length === 0) state.originalQueue = [...state.queue];
    state.index = 0;
    state.revealed = false;
    state.startedAt = performance.now();
    state.endedAt = null;
    state.wrongThisRound = [];
    render();
    startTimer();
  }
  // Start a review-drill round using only the last round's wrong cards.
  function startReviewRound() {
    if (state.wrongThisRound.length === 0) return;
    const nextDeck = shuffle([...state.wrongThisRound]);
    state.round += 1;
    state.queue = nextDeck;
    state.index = 0;
    state.revealed = false;
    state.startedAt = performance.now();
    state.endedAt = null;
    state.wrongThisRound = [];
    render();
    startTimer();
  }
  function endSession() {
    state.endedAt = performance.now();
    stopTimer();
    // Persist weak spots for this set (union of prior + this round's wrong)
    const priorForSet = currentSavedWrong();
    const combined = Array.from(new Set([...priorForSet, ...state.wrongThisRound]));
    state.savedWrong[state.set] = combined;
    saveWrong(state.savedWrong);
    // Record this round in history
    state.roundHistory.push({
      round: state.round,
      size: state.queue.length,
      wrong: state.wrongThisRound.length,
      timeMs: state.endedAt - state.startedAt,
    });
    state.index = state.queue.length;
    render();
  }
  function nextCard(mark) {
    // mark: 'right' | 'wrong' | undefined
    if (mark === 'wrong') {
      const cur = state.queue[state.index];
      if (cur && !state.wrongThisRound.includes(cur)) {
        state.wrongThisRound.push(cur);
      }
    }
    if (mark === 'right') {
      // if a card previously in savedWrong is now right (and not wrong this round), remove from saved
      const cur = state.queue[state.index];
      const savedList = state.savedWrong[state.set] || [];
      const idx = savedList.indexOf(cur);
      if (idx > -1 && !state.wrongThisRound.includes(cur)) {
        savedList.splice(idx, 1);
        state.savedWrong[state.set] = savedList;
        saveWrong(state.savedWrong);
      }
    }
    state.index += 1;
    state.revealed = false;
    if (state.index >= state.queue.length) {
      endSession();
    } else {
      render();
      // Trigger subtle flip animation
      const card = document.querySelector('.card');
      if (card) {
        card.classList.remove('flipping');
        void card.offsetWidth;
        card.classList.add('flipping');
      }
    }
  }
  function flip() {
    if (state.index < 0 || state.index >= state.queue.length) return;
    state.revealed = !state.revealed;
    render();
  }
  function clearSavedWrong() {
    state.savedWrong[state.set] = [];
    saveWrong(state.savedWrong);
    if (state.deck === 'saved') {
      state.deck = 'all';
    }
    newSession();
  }

  // ================================================================
  // Timer
  // ================================================================
  let timerId = null;
  function startTimer() {
    stopTimer();
    timerId = setInterval(updateTimer, 100);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }
  function updateTimer() {
    let text;
    if (!state.startedAt) {
      text = '0:00';
    } else {
      const now = state.endedAt || performance.now();
      const s = (now - state.startedAt) / 1000;
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      text = `${m}:${String(sec).padStart(2,'0')}`;
    }
    document.querySelectorAll('#timer, #session-timer').forEach(el => {
      el.textContent = text;
    });
  }
  function formatTime(ms) {
    const s = ms / 1000;
    if (s < 60) return `${s.toFixed(1)}s`;
    const m = Math.floor(s / 60);
    const sec = (s % 60);
    return `${m}m ${sec.toFixed(0)}s`;
  }

  // Font size for Korean word display — scales down as syllable count grows.
  function koreanFontSize(text) {
    const len = [...text].length;
    if (len <= 1) return 'clamp(120px, 26vw, 260px)';
    if (len === 2) return 'clamp(90px, 20vw, 200px)';
    if (len === 3) return 'clamp(70px, 15vw, 150px)';
    return 'clamp(56px, 12vw, 120px)';
  }

  function renderCard() {

    const isWord = info.type === 'word';

    // FRONT — what the student sees first

    if (isReverse) {

        faceContent = `<div class="card-face answer korean">${info.sound}</div>
                       <div class="card-name">${info.name}</div>`;

      // normal: show the Korean character/word big
      faceContent = `<div class="card-face korean" style="font-size: ${koreanFontSize(info.char)}">${info.char}</div>`;
    }

    // REVEAL — what shows on flip

  function renderEnd() {
    const total = state.queue.length;
    const wrong = state.wrongThisRound.length;
    const right = total - wrong;
    const timeMs = state.endedAt - state.startedAt;
    const perCardSec = (timeMs / total) / 1000;
    const accuracy = Math.round((right / total) * 100);
    const isFollowupRound = state.round > 1;

    // 완주 (0 wrong on any round > 1, or 0 wrong on round 1)
    // Route to celebration screen when a review round clears all misses.
    if (wrong === 0 && isFollowupRound) {
      renderCelebration();
      return;
    }

    // Build review tiles (each wrong card as a mini-tile with its answer)
    const wrongTiles = state.wrongThisRound.map(id => {
      const info = cardInfo(id);
      const isWord = info.type === 'word';
      const meaningLine = isWord ? `<span class="rt-meaning">${info.meaning}</span>` : `<span class="rt-meaning">${info.name}</span>`;
      return `
        <div class="review-tile">
          <span class="rt-char korean">${info.char}</span>
          <span class="rt-sound">${info.sound}</span>
          ${meaningLine}
        </div>`;
    }).join('');

    // Headline adapts to round & wrong count
    const headline = wrong === 0
      ? t('end_headline_perfect')
      : (wrong <= 3 ? t('end_headline_almost') : (isFollowupRound ? t('end_headline_more_rounds') : t('end_headline_good')));
    const bodyText = state.mode === 'diagnostic' && !isFollowupRound
      ? t('end_body_diagnostic')
      : (isFollowupRound ? t('end_body_review') : t('end_body_generic'));

    const savedTotal = currentSavedWrong().length;

    main.innerHTML = `
      <div class="screen">
        ${isFollowupRound ? `<span class="round-badge">${t('end_round_badge', state.round)}</span>` : ''}
        <h1>${headline}</h1>
        <p>${bodyText}</p>
        <div class="result-grid">
          <div class="result-cell">
            <span class="label">${t('end_stat_total_time')}</span>
            <span class="value mono">${formatTime(timeMs)}</span>
          </div>
          <div class="result-cell">
            <span class="label">${t('end_stat_per_card')}</span>
            <span class="value mono">${perCardSec.toFixed(2).replace(/\.?0+$/, '')}<span style="font-size:14px;color:var(--muted);margin-left:2px">${t('end_time_seconds')}</span></span>
          </div>
          <div class="result-cell">
            <span class="label">${t('end_stat_accuracy')}</span>
            <span class="value mono">${accuracy}<span style="font-size:16px;color:var(--muted)">%</span></span>
          </div>
          <div class="result-cell">
            <span class="label">${t('end_stat_wrong')}</span>
            <span class="value mono" style="color:${wrong ? 'var(--wrong)' : 'inherit'}">${wrong}<span style="font-size:14px;color:var(--muted);margin-left:4px">/ ${total}</span></span>
          </div>
        </div>
        ${wrong > 0 ? `
          <div class="review-block">
            <h3>${t('end_review_title', wrong)}</h3>
            <p class="review-sub">${t('end_review_sub', wrong)}</p>
            <div class="review-grid">${wrongTiles}</div>
          </div>` : ''}
        <div class="screen-actions">
          ${wrong > 0
            ? `<button class="btn" id="review-drill-btn">${t('end_btn_review_drill', wrong)} <span class="kbd">Space</span></button>`
            : `<button class="btn" id="again-btn">${t('end_btn_again')} <span class="kbd">Space</span></button>`}
          ${wrong > 0 ? `<button class="btn ghost" id="again-btn">${t('end_btn_again')}</button>` : ''}
          ${savedTotal > 0 ? `<button class="btn ghost" id="clear-wrong-btn">${t('end_btn_clear_weak')}</button>` : ''}
          <button class="btn ghost" id="home-btn">${t('end_btn_home')}</button>
        </div>
      </div>
    `;
    const bindOr = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    bindOr('review-drill-btn', () => startReviewRound());
    bindOr('again-btn', () => { newSession(); startSession(); });
    bindOr('clear-wrong-btn', () => {
      if (confirm(t('confirm_clear_saved'))) clearSavedWrong();
    });
    bindOr('home-btn', () => newSession());
  }

  function renderCelebration() {
    const totalRounds = state.roundHistory.length;
    const totalTime = state.roundHistory.reduce((s, r) => s + r.timeMs, 0);
    const originalSize = state.originalQueue.length;
    const unitCardsWord = t('unit_cards', 0).replace(/^\d+\s*/, '').trim(); // "장" or "cards"

    const rows = state.roundHistory.map(r => {
      const cleared = r.wrong === 0;
      return `
        <div class="round-row ${cleared ? 'cleared' : ''}">
          <span class="r-num">R${r.round}</span>
          <span class="r-detail">${r.size} ${unitCardsWord} · ${formatTime(r.timeMs)}</span>
          <span class="r-wrong">${t('celeb_round_wrong_label')} <strong>${r.wrong}</strong></span>
        </div>`;
    }).join('');

    main.innerHTML = `
      <div class="screen">
        <h1>${t('celeb_headline')}</h1>
        <p>${t('celeb_body', originalSize, totalRounds, formatTime(totalTime))}</p>
        <div class="round-history">
          <h3>${t('celeb_history_title')}</h3>
          ${rows}
        </div>
        <div class="screen-actions">
          <button class="btn" id="home-btn">${t('celeb_btn_home')} <span class="kbd">Space</span></button>
          <button class="btn ghost" id="again-btn">${t('celeb_btn_again')}</button>
          ${currentSavedWrong().length > 0 ? `<button class="btn ghost" id="clear-wrong-btn">${t('end_btn_clear_weak')}</button>` : ''}
        </div>
      </div>
    `;
    document.getElementById('home-btn').onclick = () => newSession();
    document.getElementById('again-btn').onclick = () => { newSession(); startSession(); };
    const clear = document.getElementById('clear-wrong-btn');
    if (clear) clear.onclick = () => {
      if (confirm(t('confirm_clear_saved'))) clearSavedWrong();
    };
  }

  // Deck definitions per set — key + i18n token for label
  const DECK_OPTIONS = {
    jamo: [
      {key:'all',       i18n:'deck_all_jamo'},
      {key:'consonant', i18n:'deck_consonant'},
      {key:'vowel',     i18n:'deck_vowel'},
      {key:'basic',     i18n:'deck_basic'},
      {key:'hard',      i18n:'deck_hard'},
      {key:'complex',   i18n:'deck_complex'},
    ],
    word: [
      {key:'all',    i18n:'deck_all_word'},
      {key:'noun',   i18n:'deck_noun'},
      {key:'people', i18n:'deck_people'},
      {key:'food',   i18n:'deck_food'},
      {key:'verb',   i18n:'deck_verb'},
      {key:'adj',    i18n:'deck_adj'},
      {key:'time',   i18n:'deck_time'},
      {key:'place',  i18n:'deck_place'},
    ],
  };

  function deckLabelFor(set, deckKey) {
    if (deckKey === 'saved') return t('deck_saved', currentSavedWrong().length);
    const opt = (DECK_OPTIONS[set] || []).find(o => o.key === deckKey);
    return opt ? t(opt.i18n) : '';
  }

  function renderDeckChips() {
    const container = document.getElementById('deck-chips');
    if (!container) return;  // only renders when landing is active
    const opts = DECK_OPTIONS[state.set];
    const savedCount = currentSavedWrong().length;
    container.innerHTML = opts.map(o =>
      `<button class="chip${o.key === state.deck ? ' active' : ''}" data-deck="${o.key}">${t(o.i18n)}</button>`
    ).join('') +
      `<button class="chip${state.deck === 'saved' ? ' active' : ''}" data-deck="saved" id="chip-saved"${savedCount === 0 ? ' disabled' : ''}>${t('deck_saved', savedCount)}</button>`;
    container.querySelectorAll('.chip').forEach(btn => {
      btn.onclick = () => {
        if (btn.disabled) return;
        state.deck = btn.dataset.deck;
        renderDeckChips();
      };
    });
  }

  function updateActiveChip() {
    // Deck chip active state (guarded — only re-renders if on landing)
    renderDeckChips();
    // Set chip active state (only present on landing)
    document.querySelectorAll('.set-chip').forEach(el => {
      el.classList.toggle('active', el.dataset.set === state.set);
    });
  }

  // ================================================================
  // Wiring
  // ================================================================
  // Brand acts as Home link
  document.getElementById('brand-home').onclick = () => newSession();
  // Note: set-chip wiring is done inside renderStart() now (chips are rendered there)
  document.getElementById('restart').onclick = () => newSession();
  document.getElementById('header-help').onclick = showHelp;

  // Language toggle
  document.getElementById('lang-toggle').onclick = () => {
    state.lang = state.lang === 'ko' ? 'en' : 'ko';
    saveLang(state.lang);
    applyStaticI18n();
    render();  // will re-render landing (with chips) or card/end/celebration
    // Close help modal if open — content is stale
    document.getElementById('modal-backdrop')?.remove();
  };

  // Theme toggle
  document.getElementById('theme-toggle').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const isDark = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  };

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const modal = document.getElementById('modal-backdrop');
    if (modal) {
      if (e.key === 'Escape') { modal.remove(); e.preventDefault(); }
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      if (state.index === -1) startSession();
      else if (state.index >= state.queue.length) {
        // End or celebration screen: trigger the primary CTA if present, else start fresh
        const reviewBtn = document.getElementById('review-drill-btn');
        const homeBtn = document.getElementById('home-btn');
        const againBtn = document.getElementById('again-btn');
        if (reviewBtn) reviewBtn.click();
        else if (homeBtn && state.wrongThisRound.length === 0 && state.round > 1) homeBtn.click();
        else if (againBtn) againBtn.click();
        else { newSession(); startSession(); }
      }
      else if (state.mode === 'study') nextCard();
      else flip();
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      flip();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (state.index >= 0 && state.index < state.queue.length && state.mode !== 'study') nextCard('wrong');
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      if (state.index >= 0 && state.index < state.queue.length) {
        if (state.mode === 'study') nextCard();
        else nextCard('right');
      }
    } else if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      newSession();
    }
  });

  // First paint
  applyStaticI18n();
  newSession();
</script>
</body>
</html>
