<style>
  :root {
    --bg: #F6F1E7;
    --card-bg: #FFFCF6;
    --ink: #1F1B16;
    --muted: #8B7F6D;
    --rule: #E2D9C7;
    --accent: #2E4372;
    --correct: #3F6B3A;
    --wrong: #A83E2A;
    --btn-shadow: 0 1px 0 rgba(31,27,22,0.08);
    --card-shadow: 0 30px 60px -35px rgba(31,27,22,0.35), 0 4px 12px -4px rgba(31,27,22,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17130E;
      --card-bg: #211C16;
      --ink: #F1EADB;
      --muted: #8D8474;
      --rule: #2E2823;
      --accent: #8FA5D6;
      --correct: #7BAF71;
      --wrong: #D97960;
      --btn-shadow: 0 1px 0 rgba(0,0,0,0.4);
      --card-shadow: 0 40px 80px -40px rgba(0,0,0,0.7), 0 4px 12px -4px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="light"] {
    --bg: #F6F1E7; --card-bg: #FFFCF6; --ink: #1F1B16; --muted: #8B7F6D;
    --rule: #E2D9C7; --accent: #2E4372; --correct: #3F6B3A; --wrong: #A83E2A;
    --btn-shadow: 0 1px 0 rgba(31,27,22,0.08);
    --card-shadow: 0 30px 60px -35px rgba(31,27,22,0.35), 0 4px 12px -4px rgba(31,27,22,0.08);
  }
  :root[data-theme="dark"] {
    --bg: #17130E; --card-bg: #211C16; --ink: #F1EADB; --muted: #8D8474;
    --rule: #2E2823; --accent: #8FA5D6; --correct: #7BAF71; --wrong: #D97960;
    --btn-shadow: 0 1px 0 rgba(0,0,0,0.4);
    --card-shadow: 0 40px 80px -40px rgba(0,0,0,0.7), 0 4px 12px -4px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow: hidden;
  }
  .korean {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Nanum Gothic", system-ui, sans-serif;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    flex-shrink: 0;
  }
  .brand {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 2px;
    background: transparent;
    border: none;
    padding: 4px 8px;
    margin: -4px -8px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    transition: background 0.15s, color 0.15s;
  }
  .brand:hover { background: var(--card-bg); }
  .brand:hover .brand-title { color: var(--accent); }
  .brand-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.005em;
    color: var(--ink);
    line-height: 1.2;
    transition: color 0.15s;
  }
  .brand-subtitle {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.2;
  }
  .header-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .segmented {
    display: inline-flex;
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .segmented button {
    padding: 6px 14px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-family: inherit;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  .segmented button:hover { color: var(--ink); }
  .segmented button.active {
    background: var(--ink);
    color: var(--bg);
  }

  .stats {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 13px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.15;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat-value {
    font-size: 16px;
  }
  .stat-value.mono { font-size: 15px; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .deck-filter {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .deck-filter label {
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 10px;
  }
  .deck-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .chip {
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
  .chip.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .chip:disabled { opacity: 0.35; cursor: not-allowed; }
  .chip.set-chip {
    font-weight: 500;
  }
  .chip.set-chip.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }

  .toolbar-right {
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    border-radius: 6px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--muted); }

  /* ---------- Main ---------- */
  main {
    flex: 1;
    display: flex;
    align-items: safe center;
    justify-content: safe center;
    padding: 24px;
    overflow: auto;
    position: relative;
  }

  /* ---------- Card ---------- */
  .card-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    max-width: 100%;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 20px;
    width: min(560px, 88vw);
    aspect-ratio: 3 / 4;
    max-height: calc(100vh - 260px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: var(--card-shadow);
    padding: 32px;
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card:active { transform: translateY(0); }
  .card.flipping {
    animation: flip 0.35s ease;
  }
  @keyframes flip {
    0% { transform: rotateY(0); }
    50% { transform: rotateY(90deg); }
    100% { transform: rotateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .card:hover { transition: none; transform: none; }
    .card.flipping { animation: none; }
  }

  .card-index {
    position: absolute;
    top: 20px;
    left: 24px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .card-hint {
    position: absolute;
    bottom: 20px;
    right: 24px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .card-face {
    font-size: clamp(120px, 26vw, 260px);
    line-height: 1;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .card-face.answer {
    font-size: clamp(72px, 14vw, 140px);
  }

  .card-reveal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    min-height: 60px;
  }
  .card-reveal.hidden { visibility: hidden; }
  .card-sound {
    font-size: 24px;
    color: var(--accent);
    letter-spacing: 0.02em;
    font-weight: 500;
  }
  .card-name {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- Action buttons ---------- */
  .actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn {
    padding: 12px 22px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--bg);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    min-width: 108px;
    box-shadow: var(--btn-shadow);
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--rule);
  }
  .btn.ghost:hover { border-color: var(--muted); }
  .btn.wrong {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #FFF8F3;
  }
  .btn.correct {
    background: var(--correct);
    border-color: var(--correct);
    color: #F5FAF3;
  }
  .btn .kbd {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 6px;
    font-size: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    opacity: 0.7;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    vertical-align: 1px;
  }
  .btn.ghost .kbd {
    border-color: var(--rule);
    color: var(--muted);
  }

  /* ---------- Start / End screens ---------- */
  .screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 520px;
    padding: 40px 24px;
  }
  .screen h1 {
    font-size: 34px;
    font-weight: 500;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .screen p {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 15px;
    max-width: 42ch;
    text-wrap: balance;
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 28px;
    width: 100%;
    max-width: 400px;
  }
  .result-cell {
    background: var(--card-bg);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .result-cell .label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .result-cell .value {
    font-size: 32px;
    font-weight: 500;
    line-height: 1;
  }

  /* ---------- Review grid (end of round) ---------- */
  .review-block {
    margin-top: 8px;
    padding: 20px 20px 24px;
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 14px;
    width: 100%;
    max-width: 640px;
    text-align: left;
  }
  .review-block h3 {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px;
    font-weight: 500;
  }
  .review-block .review-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .review-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .review-tile {
    background: var(--bg);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--wrong);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 76px;
  }
  .review-tile .rt-char {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 26px;
    line-height: 1.15;
    color: var(--ink);
  }
  .review-tile .rt-sound {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }
  .review-tile .rt-meaning {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.35;
  }

  /* ---------- Round chip badge on end screen ---------- */
  .round-badge {
    display: inline-block;
    padding: 4px 12px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-radius: 999px;
    margin-bottom: 12px;
    font-weight: 500;
  }

  /* ---------- Round history (celebration) ---------- */
  .round-history {
    margin-top: 16px;
    padding: 18px 20px;
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 12px;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .round-history h3 {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 500;
    text-align: left;
  }
  .round-row {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  .round-row:last-child { border-bottom: none; }
  .round-row .r-num {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .round-row .r-detail {
    font-variant-numeric: tabular-nums;
  }
  .round-row .r-wrong {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .round-row .r-wrong strong {
    color: var(--ink);
    font-weight: 500;
  }
  .round-row.cleared .r-wrong strong { color: var(--correct); }

  .screen-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ---------- Footer ---------- */
  footer {
    padding: 10px 24px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    flex-shrink: 0;
  }
  .shortcuts {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .shortcut {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .shortcut kbd {
    display: inline-block;
    padding: 2px 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--ink);
    letter-spacing: 0;
  }

  /* ---------- Focus states ---------- */
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Session modal (card viewing) ---------- */
  .session-modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .session-header {
    flex: 0 0 auto;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--rule);
  }
  .session-back {
    background: transparent;
    border: 1px solid var(--rule);
    cursor: pointer;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color 0.15s, border-color 0.15s;
  }
  .session-back:hover { color: var(--ink); border-color: var(--muted); }
  .session-nav {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  .session-prev:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .session-prev:disabled:hover { color: var(--muted); border-color: var(--rule); }
  .session-stats-mini {
    display: flex;
    gap: 20px;
  }
  .session-stats-mini .s-item {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.15;
    gap: 2px;
  }
  .session-stats-mini .s-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .session-stats-mini .s-value {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    color: var(--ink);
  }
  .session-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    min-height: 0;
    overflow: hidden;
  }
  /* Wrapper that provides the available space for the square card */
  .session-card-slot {
    flex: 1;
    width: 100%;
    max-width: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .session-card {
    aspect-ratio: 1;
    /* vh fallback first, then dvh progressive override */
    width: min(100%, calc(100vh - 220px), 520px);
    width: min(100%, calc(100dvh - 220px), 520px);
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-shadow: var(--card-shadow);
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: transform 0.15s ease;
  }
  .session-card:hover { transform: translateY(-2px); }
  .session-card.flipping { animation: flip 0.35s ease; }
  .session-card .card-face {
    font-size: min(28vw, 34vh, 220px);
    line-height: 1;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.02em;
    text-align: center;
  }
  .session-card .card-face.answer {
    font-size: min(14vw, 16vh, 100px);
  }
  .session-card .card-index {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .session-card .card-hint {
    position: absolute;
    bottom: 16px;
    right: 20px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .card-listen {
    position: absolute;
    top: 14px;
    right: 18px;
    width: 42px;
    height: 42px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--muted);
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: inline-flex;
    align-items: center;

<script>
  // ================================================================
  // Data
  // ================================================================
  // ================================================================
  // Week data helpers — 실제 데이터는 data/weekN.js 에서 로드됨
  // ================================================================
  const WEEK_DATA = window.WEEK_DATA || {};

  function currentWeekData() {
    return WEEK_DATA[state?.week || 1] || null;
  }
  function weekHasContent(n) {
    const d = WEEK_DATA[n];
    return !!(d && ((d.jamo && d.jamo.length) || (d.words && d.words.length)));
  }
  function weekIsUnlocked(n) {
    if (n === 1) return true;                          // Week 1은 항상 열림
    return (state?.unlockedWeeks || []).includes(n);
  }
  function getSetCards(set) {
    const data = currentWeekData();
    if (!data) return [];
    if (set === 'jamo') return data.jamo || [];
    if (set === 'word') return data.words || [];
    return [];
  }
  function getCurrentDeckOptions() {
    const data = currentWeekData();
    if (data && data.deckOptions) return data.deckOptions;
    return { jamo: [], word: [] };
  }
  // 덱 옵션 라벨 해석 — 인라인 label_ko/label_en 우선, 없으면 i18n 키
  function deckOptLabel(o) {
    if (o.label_ko || o.label_en) {
      return state.lang === 'en' ? (o.label_en || o.label_ko) : (o.label_ko || o.label_en);
    }
    return o.i18n ? t(o.i18n) : '';
  }
  // 이 주차에서 카드가 있는 세트만 반환 (['jamo','word'] 중)
  function availableSets() {
    const data = currentWeekData();
    if (!data) return [];
    const out = [];
    if (data.jamo && data.jamo.length) out.push('jamo');
    if (data.words && data.words.length) out.push('word');
    return out;
  }

  // i18n

  const LANG_KEY = 'jamo-flashcards-lang-v1';
  function loadLang() {
    try {
      const v = localStorage.getItem(LANG_KEY);
      return (v === 'ko' || v === 'en') ? v : 'ko';
    } catch { return 'ko'; }
  }
  function saveLang(lang) {
    try { localStorage.setItem(LANG_KEY, lang); } catch {}
  }
  function t(key, ...args) {
    const val = LOCALES[state.lang]?.[key] ?? LOCALES.ko[key];
    return typeof val === 'function' ? val(...args) : val;
  }
  function applyStaticI18n() {
    document.title = t('brand_title');
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-attr]').forEach(el => {
      // format: "attrName:key,attrName:key"
      el.dataset.i18nAttr.split(',').forEach(pair => {
        const [attr, key] = pair.split(':').map(s => s.trim());
        el.setAttribute(attr, t(key));
      });
    });
    // Language toggle button label shows the OTHER language
    const langBtn = document.getElementById('lang-toggle');
    if (langBtn) langBtn.textContent = t('btn_lang');
    // Update html lang attribute
    document.documentElement.setAttribute('lang', state.lang);
  }

  // ================================================================
  // State
  // ================================================================
  const STORAGE_KEY = 'jamo-flashcards-v2';       // v2 = 주차별 네임스페이스
  const LEGACY_STORAGE_KEY = 'jamo-flashcards-v1'; // v1 = 단일 세트 (마이그레이션용)
  const WEEK_KEY = 'jamo-flashcards-week-v1';
  const UNLOCK_KEY = 'jamo-flashcards-unlocked-v1';

  // ---- URL query params (예: ?week=2, ?reset=1) ----
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('reset') === '1') {
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(WEEK_KEY);
      localStorage.removeItem(UNLOCK_KEY);
    } catch {}
  }

  function loadWeek() {
    const q = parseInt(urlParams.get('week'), 10);
    if (q >= 1 && q <= 4) return q;
    try {
      const v = parseInt(localStorage.getItem(WEEK_KEY), 10);
      return (v >= 1 && v <= 4) ? v : 1;
    } catch { return 1; }
  }
  function saveWeek(n) {
    try { localStorage.setItem(WEEK_KEY, String(n)); } catch {}
  }
  function loadUnlockedWeeks() {
    try {
      const raw = localStorage.getItem(UNLOCK_KEY);
      if (!raw) return [1];
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [1];
      return Array.from(new Set([1, ...arr.filter(n => n >= 1 && n <= 4)]));
    } catch { return [1]; }
  }
  function saveUnlockedWeeks(list) {
    try { localStorage.setItem(UNLOCK_KEY, JSON.stringify(list)); } catch {}
  }

  const state = {
    lang: loadLang(),                     // 'ko' | 'en'
    week: loadWeek(),                     // 1 ~ 4
    unlockedWeeks: loadUnlockedWeeks(),   // [1, 2, ...]
    set: 'jamo',                          // 'jamo' | 'word'
    mode: 'diagnostic',                   // 'diagnostic' | 'study' | 'reverse'
    deck: 'all',
    queue: [],                            // shuffled deck of card ids (this session/round)
    originalQueue: [],                    // full deck when session started (for round 1 reference)
    index: -1,                            // -1 = start screen, queue.length = end screen
    revealed: false,
    startedAt: null,
    endedAt: null,
    round: 1,                             // review-drill round counter
    roundHistory: [],                     // [{round, size, wrong, timeMs}, ...] for celebration
    wrongThisRound: [],                   // list of card ids marked wrong (this round)
    savedWrong: loadWrong(),              // { 1: {jamo:[], word:[]}, 2: {...}, ... }
  };

  function loadWrong() {
    // 우선 v2 (주차별) 시도
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          // 이미 주차별 구조
          if (parsed[1] || parsed[2] || parsed[3] || parsed[4]) return parsed;
        }
      }
    } catch {}
    // v1 (단일 세트) 마이그레이션 · Week 1 슬롯으로 이관
    try {
      const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (legacy) {
        const parsed = JSON.parse(legacy);
        if (Array.isArray(parsed)) return { 1: { jamo: parsed, word: [] } };
        if (parsed && (parsed.jamo || parsed.word)) {
          return { 1: { jamo: parsed.jamo || [], word: parsed.word || [] } };
        }
      }
    } catch {}
    return {};
  }
  function saveWrong(obj) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch {}
  }
  function currentSavedWrong() {
    const w = state.savedWrong[state.week];
    return (w && w[state.set]) || [];
  }
  function setSavedWrong(list) {
    if (!state.savedWrong[state.week]) state.savedWrong[state.week] = { jamo: [], word: [] };
    state.savedWrong[state.week][state.set] = list;
    saveWrong(state.savedWrong);
  }

  // ================================================================
  // Deck filtering
  // ================================================================
  function cardsFor(set, deck) {
    const pool = getSetCards(set);
    if (deck === 'all') return pool.map(c => c.id);
    if (deck === 'saved') return currentSavedWrong().filter(id => pool.find(c => c.id === id));
    return pool.filter(c => c.groups.includes(deck)).map(c => c.id);
  }
  function shuffle(arr) {
    const out = [...arr];
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }
  function cardInfo(id) {
    const data = currentWeekData();
    if (!data) return null;
    return (data.jamo || []).find(c => c.id === id) ||
           (data.words || []).find(c => c.id === id) ||
           null;
  }
  // legacy alias for any leftover call sites
  const jamoInfo = cardInfo;

  // ================================================================
  // Session control
  // ================================================================
  function newSession() {
    state.queue = shuffle(cardsFor(state.set, state.deck));
    state.originalQueue = [...state.queue];
    state.index = -1;
    state.revealed = false;
    state.startedAt = null;
    state.endedAt = null;
    state.round = 1;
    state.roundHistory = [];
    state.wrongThisRound = [];
    render();
  }
  function startSession() {
    // Always rebuild queue from current set/deck.
    // Chip clicks update state but don't touch state.queue,
    // so the queue must be regenerated at session start to reflect the
    // student's latest selection.
    const fresh = shuffle(cardsFor(state.set, state.deck));
    if (fresh.length === 0) return;  // nothing to drill (e.g. empty saved deck)
    state.queue = fresh;
    state.originalQueue = [...fresh];
    state.index = 0;
    state.revealed = false;
    state.startedAt = performance.now();
    state.endedAt = null;
    state.wrongThisRound = [];
    state.round = 1;
    state.roundHistory = [];
    render();
    startTimer();
  }
  // Start a review-drill round using only the last round's wrong cards.
  function startReviewRound() {
    if (state.wrongThisRound.length === 0) return;
    const nextDeck = shuffle([...state.wrongThisRound]);
    state.round += 1;
    state.queue = nextDeck;
    state.index = 0;
    state.revealed = false;
    state.startedAt = performance.now();
    state.endedAt = null;
    state.wrongThisRound = [];
    render();
    startTimer();
  }
  function endSession() {
    state.endedAt = performance.now();
    stopTimer();
    // Persist weak spots for this week+set (union of prior + this round's wrong)
    const priorForSet = currentSavedWrong();
    const combined = Array.from(new Set([...priorForSet, ...state.wrongThisRound]));
    setSavedWrong(combined);
    // Record this round in history
    state.roundHistory.push({
      round: state.round,
      size: state.queue.length,
      wrong: state.wrongThisRound.length,
      timeMs: state.endedAt - state.startedAt,
    });
    state.index = state.queue.length;
    render();
  }
  function nextCard(mark) {
    // mark: 'right' | 'wrong' | undefined
    if (mark === 'wrong') {
      const cur = state.queue[state.index];
      if (cur && !state.wrongThisRound.includes(cur)) {
        state.wrongThisRound.push(cur);
      }
    }
    if (mark === 'right') {
      // if a card previously in savedWrong is now right (and not wrong this round), remove from saved
      const cur = state.queue[state.index];
      const savedList = [...currentSavedWrong()];
      const idx = savedList.indexOf(cur);
      if (idx > -1 && !state.wrongThisRound.includes(cur)) {
        savedList.splice(idx, 1);
        setSavedWrong(savedList);
      }
    }
    state.index += 1;
    state.revealed = false;
    if (state.index >= state.queue.length) {
      endSession();
    } else {
      render();
      // Trigger subtle flip animation
      const card = document.querySelector('.card');
      if (card) {
        card.classList.remove('flipping');
        void card.offsetWidth;
        card.classList.add('flipping');
      }
    }
  }
  function flip() {
    if (state.index < 0 || state.index >= state.queue.length) return;
    state.revealed = !state.revealed;
    render();
  }
  // 이전 카드로 돌아가기 (실수로 넘어갔을 때)
  function prevCard() {
    if (state.index <= 0) return;   // 이미 첫 카드
    state.index -= 1;
    state.revealed = false;
    // 돌아간 카드에 찍힌 '틀림' 표시를 취소해서 다시 깨끗하게 판정 가능
    const cur = state.queue[state.index];
    const wi = state.wrongThisRound.indexOf(cur);
    if (wi > -1) state.wrongThisRound.splice(wi, 1);
    render();
  }
  function clearSavedWrong() {
    setSavedWrong([]);
    if (state.deck === 'saved') {
      state.deck = 'all';
    }
    newSession();
  }

  // ================================================================
  // Timer
  // ================================================================
  let timerId = null;
  function startTimer() {
    stopTimer();
    timerId = setInterval(updateTimer, 100);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }
  function updateTimer() {
    let text;
    if (!state.startedAt) {
      text = '0:00';
    } else {
      const now = state.endedAt || performance.now();
      const s = (now - state.startedAt) / 1000;
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      text = `${m}:${String(sec).padStart(2,'0')}`;
    }
    document.querySelectorAll('#timer, #session-timer').forEach(el => {
      el.textContent = text;
    });
  }
  function formatTime(ms) {
    const s = ms / 1000;
    if (s < 60) return `${s.toFixed(1)}s`;
    const m = Math.floor(s / 60);
    const sec = (s % 60);
    return `${m}m ${sec.toFixed(0)}s`;
  }

  // ================================================================
  // Rendering
  // ================================================================
  const main = document.getElementById('main');

  function render() {
    updateStats();
    updateSavedChip();
    if (state.index === -1) renderStart();
    else if (state.index >= state.queue.length) renderEnd();
    else renderCard();
  }

  function updateStats() {
    // Header stats were removed; session modal renders its own stats inline.
    // Only the shared timer needs updating.
    updateTimer();

  function updateSavedChip() {
    const el = document.getElementById('chip-saved');
    if (!el) return;

    el.textContent = t('deck_saved', count);

  function renderWeekTabs() {
    const tabs = [1, 2, 3, 4].map(n => {
      const unlocked = weekIsUnlocked(n);
      const active = state.week === n;

      const classes = ['week-tab'];
      if (active) classes.push('active');
      if (!unlocked) classes.push('locked');
      const lockIcon = unlocked ? '' : '<span class="lock-icon">🔒</span>';
      const badge = (unlocked && !hasContent) ? ' · Coming' : '';
      return `<button class="${classes.join(' ')}" data-week-tab="${n}">${t('week_label', n)}${lockIcon}${badge}</button>`;
    }).join('');
    return `<div class="week-tabs">${tabs}</div>`;
  }

    if (document.getElementById('modal-backdrop')) return;
    const div = document.createElement('div');
    div.innerHTML = `

    const input = document.getElementById('pw-input');

    const close = () => backdrop?.remove();

    const attempt = () => {
      const value = input.value;
      const ok = typeof window.checkWeekPassword === 'function'
        ? window.checkWeekPassword(week, value)
        : false;
      if (ok) {
        // Unlock
        const list = [...state.unlockedWeeks];
        if (!list.includes(week)) list.push(week);
        state.unlockedWeeks = list;
        saveUnlockedWeeks(list);
        close();
        switchToWeek(week);
      } else {
        // Shake
        backdrop.classList.add('error');
        errEl.textContent = t('pw_error');
        input.value = '';
        setTimeout(() => { backdrop.classList.remove('error'); }, 450);
        input.focus();
      }
    };

    document.getElementById('modal-close').onclick = close;
    document.getElementById('pw-cancel').onclick = close;
    document.getElementById('pw-submit').onclick = attempt;
    backdrop.addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') close();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); attempt(); }
    });
    setTimeout(() => input.focus(), 50);
  }

  // ================================================================
  // Speech synthesis (browser Web Speech API)
  // ================================================================
  const SPEECH_OK = 'speechSynthesis' in window;
  function speak(text) {
    if (!SPEECH_OK || !text) return;
    try {
      window.speechSynthesis.cancel();  // stop anything already speaking
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.85;   // slightly slower for learners
      u.pitch = 1.0;
      const btn = document.getElementById('btn-listen');
      if (btn) btn.classList.add('speaking');
      const done = () => btn?.classList.remove('speaking');
      u.onend = done;
      u.onerror = done;
      window.speechSynthesis.speak(u);
    } catch (e) { /* silently ignore */ }
  }
  function speakCurrentCard() {
    if (state.index < 0 || state.index >= state.queue.length) return;
    const info = cardInfo(state.queue[state.index]);
    if (!info) return;
    // Words: speak the Korean word directly.
    // Jamo: speak the letter's Korean name (기역, 니은, ...) —
    // Koreans learn letters by name, and the name contains the sound.
    const text = info.type === 'word' ? info.char : info.name;
    speak(text);
  }
  const LISTEN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';

  // Font size for Korean word display — scales down as syllable count grows.
  function koreanFontSize(text) {
    const len = [...text].length;
    if (len <= 1) return 'clamp(120px, 26vw, 260px)';
    if (len === 2) return 'clamp(90px, 20vw, 200px)';
    if (len === 3) return 'clamp(70px, 15vw, 150px)';
    return 'clamp(56px, 12vw, 120px)';
  }

  function renderCard() {
    const id = state.queue[state.index];
    const info = cardInfo(id);
    const total = state.queue.length;
    const isWord = info.type === 'word';
    const isReverse = state.mode === 'reverse';

    // FRONT — what the student sees first
    let faceContent;
    if (isReverse) {
      if (isWord) {
        // reverse + word: show English meaning big
        faceContent = `<div class="card-face answer" style="font-size: clamp(36px, 6.5vw, 62px); text-align:center; padding: 0 12px;">${info.meaning}</div>`;
      } else {
        // reverse + jamo: show sound + name
        faceContent = `<div class="card-face answer korean">${info.sound}</div>
                       <div class="card-name">${info.name}</div>`;
      }
    } else {
      // normal: show the Korean character/word big
      faceContent = `<div class="card-face korean" style="font-size: ${koreanFontSize(info.char)}">${info.char}</div>`;
    }

    // REVEAL — what shows on flip
    let revealContent;
    if (isReverse) {
      // reveal shows the Korean form
      revealContent = `<div class="card-face korean" style="font-size: ${koreanFontSize(info.char)}">${info.char}</div>`;

      if (isWord) {
        revealContent = `<div class="card-sound">${info.sound}</div>
                         <div class="card-name" style="font-size:16px; color:var(--ink); font-family:inherit; letter-spacing:0; text-transform:none; margin-top:4px;">${info.meaning}</div>`;

    main.innerHTML = `

              <span class="s-value">${state.index + 1} / ${total}</span>
            </div>
            <div class="s-item">
              <span class="s-label">${t('stat_time')}</span>
              <span class="s-value" id="session-timer">0:00</span>
            </div>
            <div class="s-item">
              <span class="s-label">${t('stat_wrong')}</span>
              <span class="s-value" style="color:${state.wrongThisRound.length ? 'var(--wrong)' : 'inherit'}">${state.wrongThisRound.length}</span>
            </div>
          </div>
        </div>
        <div class="session-body">
          <div class="session-card-slot">
            <div class="session-card" id="card" role="button" tabindex="0" aria-label="Flashcard ${state.index + 1} of ${total}">
              <span class="card-index">${state.index + 1} / ${total}</span>
              ${SPEECH_OK ? `<button type="button" class="card-listen" id="btn-listen" aria-label="${t('btn_listen_aria')}" title="${t('btn_listen_aria')} (L)">${LISTEN_SVG}</button>` : ''}
              ${faceContent}
              <div class="card-reveal ${showReveal ? '' : 'hidden'}">
                ${revealContent}
              </div>
              <span class="card-hint">${hint}</span>
            </div>
          </div>
          <div class="session-actions">${actions}</div>
        </div>
      </div>
    `;

    document.getElementById('card').onclick = () => {
      if (state.mode === 'study' && state.revealed) {
        nextCard();
      } else {
        flip();
      }
    };
    document.getElementById('session-back').onclick = () => newSession();
    const bindOr = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    bindOr('session-prev', () => prevCard());
    bindOr('btn-wrong', () => nextCard('wrong'));
    bindOr('btn-right', () => nextCard('right'));
    bindOr('btn-flip', flip);
    bindOr('btn-next', () => nextCard());
    const listenBtn = document.getElementById('btn-listen');
    if (listenBtn) {
      listenBtn.onclick = (e) => {
        e.stopPropagation();  // don't flip the card
        speakCurrentCard();
      };
    }
    updateTimer();
  }

  function renderEnd() {
    const total = state.queue.length;
    const wrong = state.wrongThisRound.length;
    const right = total - wrong;
    const timeMs = state.endedAt - state.startedAt;
    const perCardSec = (timeMs / total) / 1000;
    const accuracy = Math.round((right / total) * 100);
    const isFollowupRound = state.round > 1;

    // 완주 (0 wrong on any round > 1, or 0 wrong on round 1)
    // Route to celebration screen when a review round clears all misses.
    if (wrong === 0 && isFollowupRound) {
      renderCelebration();
      return;
    }

    // Build review tiles (each wrong card as a mini-tile with its answer)
    const wrongTiles = state.wrongThisRound.map(id => {
      const info = cardInfo(id);
      const isWord = info.type === 'word';
      const meaningLine = isWord ? `<span class="rt-meaning">${info.meaning}</span>` : `<span class="rt-meaning">${info.name}</span>`;
      return `
        <div class="review-tile">
          <span class="rt-char korean">${info.char}</span>
          <span class="rt-sound">${info.sound}</span>
          ${meaningLine}
        </div>`;
    }).join('');

    // Headline adapts to round & wrong count
    const headline = wrong === 0
      ? t('end_headline_perfect')
      : (wrong <= 3 ? t('end_headline_almost') : (isFollowupRound ? t('end_headline_more_rounds') : t('end_headline_good')));
    const bodyText = state.mode === 'diagnostic' && !isFollowupRound
      ? t('end_body_diagnostic')
      : (isFollowupRound ? t('end_body_review') : t('end_body_generic'));

    const savedTotal = currentSavedWrong().length;

    main.innerHTML = `
      <div class="screen">
        ${isFollowupRound ? `<span class="round-badge">${t('end_round_badge', state.round)}</span>` : ''}
        <h1>${headline}</h1>
        <p>${bodyText}</p>
        <div class="result-grid">
          <div class="result-cell">
            <span class="label">${t('end_stat_total_time')}</span>
            <span class="value mono">${formatTime(timeMs)}</span>
          </div>
          <div class="result-cell">
            <span class="label">${t('end_stat_per_card')}</span>
            <span class="value mono">${perCardSec.toFixed(2).replace(/\.?0+$/, '')}<span style="font-size:14px;color:var(--muted);margin-left:2px">${t('end_time_seconds')}</span></span>
          </div>
          <div class="result-cell">
            <span class="label">${t('end_stat_accuracy')}</span>
            <span class="value mono">${accuracy}<span style="font-size:16px;color:var(--muted)">%</span></span>
          </div>
          <div class="result-cell">
            <span class="label">${t('end_stat_wrong')}</span>
            <span class="value mono" style="color:${wrong ? 'var(--wrong)' : 'inherit'}">${wrong}<span style="font-size:14px;color:var(--muted);margin-left:4px">/ ${total}</span></span>
          </div>
        </div>
        ${wrong > 0 ? `
          <div class="review-block">
            <h3>${t('end_review_title', wrong)}</h3>
            <p class="review-sub">${t('end_review_sub', wrong)}</p>
            <div class="review-grid">${wrongTiles}</div>
          </div>` : ''}
        <div class="screen-actions">
          ${wrong > 0
            ? `<button class="btn" id="review-drill-btn">${t('end_btn_review_drill', wrong)} <span class="kbd">Space</span></button>`
            : `<button class="btn" id="again-btn">${t('end_btn_again')} <span class="kbd">Space</span></button>`}
          ${wrong > 0 ? `<button class="btn ghost" id="again-btn">${t('end_btn_again')}</button>` : ''}
          ${savedTotal > 0 ? `<button class="btn ghost" id="clear-wrong-btn">${t('end_btn_clear_weak')}</button>` : ''}
          <button class="btn ghost" id="home-btn">${t('end_btn_home')}</button>
        </div>
      </div>
    `;
    const bindOr = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    bindOr('review-drill-btn', () => startReviewRound());
    bindOr('again-btn', () => { newSession(); startSession(); });
    bindOr('clear-wrong-btn', () => {
      if (confirm(t('confirm_clear_saved'))) clearSavedWrong();
    });
    bindOr('home-btn', () => newSession());
  }

  function renderCelebration() {
    const totalRounds = state.roundHistory.length;
    const totalTime = state.roundHistory.reduce((s, r) => s + r.timeMs, 0);
    const originalSize = state.originalQueue.length;
    const unitCardsWord = t('unit_cards', 0).replace(/^\d+\s*/, '').trim(); // "장" or "cards"

    const rows = state.roundHistory.map(r => {
      const cleared = r.wrong === 0;
      return `
        <div class="round-row ${cleared ? 'cleared' : ''}">
          <span class="r-num">R${r.round}</span>
          <span class="r-detail">${r.size} ${unitCardsWord} · ${formatTime(r.timeMs)}</span>
          <span class="r-wrong">${t('celeb_round_wrong_label')} <strong>${r.wrong}</strong></span>
        </div>`;
    }).join('');

    main.innerHTML = `
      <div class="screen">
        <h1>${t('celeb_headline')}</h1>
        <p>${t('celeb_body', originalSize, totalRounds, formatTime(totalTime))}</p>
        <div class="round-history">
          <h3>${t('celeb_history_title')}</h3>
          ${rows}
        </div>
        <div class="screen-actions">
          <button class="btn" id="home-btn">${t('celeb_btn_home')} <span class="kbd">Space</span></button>
          <button class="btn ghost" id="again-btn">${t('celeb_btn_again')}</button>
          ${currentSavedWrong().length > 0 ? `<button class="btn ghost" id="clear-wrong-btn">${t('end_btn_clear_weak')}</button>` : ''}
        </div>
      </div>
    `;
    document.getElementById('home-btn').onclick = () => newSession();
    document.getElementById('again-btn').onclick = () => { newSession(); startSession(); };
    const clear = document.getElementById('clear-wrong-btn');
    if (clear) clear.onclick = () => {
      if (confirm(t('confirm_clear_saved'))) clearSavedWrong();
    };
  }

  // Deck options는 이제 주차별 데이터에서 가져옴 (data/weekN.js 의 deckOptions)

  function deckLabelFor(set, deckKey) {
    if (deckKey === 'saved') return t('deck_saved', currentSavedWrong().length);
    const opts = getCurrentDeckOptions();
    const opt = (opts[set] || []).find(o => o.key === deckKey);
    return opt ? deckOptLabel(opt) : '';
  }

  function renderDeckChips() {
    const container = document.getElementById('deck-chips');
    if (!container) return;  // only renders when landing is active
    const opts = getCurrentDeckOptions()[state.set] || [];
    const savedCount = currentSavedWrong().length;
    container.innerHTML = opts.map(o =>
      `<button class="chip${o.key === state.deck ? ' active' : ''}" data-deck="${o.key}">${deckOptLabel(o)}</button>`
    ).join('') +
      `<button class="chip${state.deck === 'saved' ? ' active' : ''}" data-deck="saved" id="chip-saved"${savedCount === 0 ? ' disabled' : ''}>${t('deck_saved', savedCount)}</button>`;
    container.querySelectorAll('.chip').forEach(btn => {
      btn.onclick = () => {
        if (btn.disabled) return;
        state.deck = btn.dataset.deck;
        renderDeckChips();
      };
    });
  }

  function updateActiveChip() {
    // Deck chip active state (guarded — only re-renders if on landing)
    renderDeckChips();
    // Set chip active state (only present on landing)
    document.querySelectorAll('.set-chip').forEach(el => {
      el.classList.toggle('active', el.dataset.set === state.set);
    });
  }

  // ================================================================
  // Wiring
  // ================================================================
  // Brand acts as Home link
  document.getElementById('brand-home').onclick = () => newSession();
  // Note: set-chip wiring is done inside renderStart() now (chips are rendered there)
  document.getElementById('restart').onclick = () => newSession();
  document.getElementById('header-help').onclick = showHelp;

  // Language toggle
  document.getElementById('lang-toggle').onclick = () => {
    state.lang = state.lang === 'ko' ? 'en' : 'ko';
    saveLang(state.lang);
    applyStaticI18n();
    render();  // will re-render landing (with chips) or card/end/celebration
    // Close help modal if open — content is stale
    document.getElementById('modal-backdrop')?.remove();
  };

  // Theme toggle
  document.getElementById('theme-toggle').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const isDark = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  };

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const modal = document.getElementById('modal-backdrop');
    if (modal) {
      if (e.key === 'Escape') { modal.remove(); e.preventDefault(); }
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      if (state.index === -1) startSession();
      else if (state.index >= state.queue.length) {
        // End or celebration screen: trigger the primary CTA if present, else start fresh
        const reviewBtn = document.getElementById('review-drill-btn');
        const homeBtn = document.getElementById('home-btn');
        const againBtn = document.getElementById('again-btn');
        if (reviewBtn) reviewBtn.click();
        else if (homeBtn && state.wrongThisRound.length === 0 && state.round > 1) homeBtn.click();
        else if (againBtn) againBtn.click();
        else { newSession(); startSession(); }
      }
      else if (state.mode === 'study') nextCard();
      else flip();
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      flip();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (state.index >= 0 && state.index < state.queue.length && state.mode !== 'study') nextCard('wrong');
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      if (state.index >= 0 && state.index < state.queue.length) {
        if (state.mode === 'study') nextCard();
        else nextCard('right');
      }
    } else if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      newSession();
    } else if (e.key === 'l' || e.key === 'L') {
      e.preventDefault();
      if (state.index >= 0 && state.index < state.queue.length) speakCurrentCard();
    } else if (e.key === 'Backspace' || e.key === 'ArrowUp') {
      // 이전 카드로 (실수로 넘어갔을 때)
      e.preventDefault();
      if (state.index > 0 && state.index < state.queue.length) prevCard();
    }
  });

  // First paint
  applyStaticI18n();
  newSession();
</script>
</body>
</html>
